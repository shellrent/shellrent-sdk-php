name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  composer:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer validate --strict

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
      - run: vendor/bin/phpunit
        env:
          # The integration test is skipped unless these secrets are set.
          SHELLRENT_CLIENT_ID: ${{ secrets.SHELLRENT_CLIENT_ID }}
          SHELLRENT_CLIENT_SECRET: ${{ secrets.SHELLRENT_CLIENT_SECRET }}
          SHELLRENT_API_URL: ${{ vars.SHELLRENT_API_URL }}

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/generate
      - name: Compare with the committed code
        run: |
          git add --all --intent-to-add
          git diff --stat --exit-code

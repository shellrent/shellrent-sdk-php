name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  composer:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer validate --strict

  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # The minimum versions allowed by composer.json.
          - php: '8.1'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration tests (not blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, json, mbstring
          coverage: none
      - uses: ramsey/composer-install@v4
      # The abuse IP check of the API can reject the Azure addresses of the GitHub runners, which are not
      # fixed: a failure is reported as a warning and does not fail the workflow.
      - id: phpunit
        run: vendor/bin/phpunit --testsuite integration
        continue-on-error: true
        env:
          # The tests are skipped unless these secrets are set.
          SHELLRENT_CLIENT_ID: ${{ secrets.SHELLRENT_CLIENT_ID }}
          SHELLRENT_CLIENT_SECRET: ${{ secrets.SHELLRENT_CLIENT_SECRET }}
          SHELLRENT_API_URL: ${{ vars.SHELLRENT_API_URL }}
      - if: steps.phpunit.outcome == 'failure'
        run: echo "::warning title=Integration tests::The integration tests failed, see the log of the PHPUnit step (the API may have rejected the IP address of the runner)."

  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/generate
      - name: Compare with the committed code
        run: |
          git add --all --intent-to-add
          git diff --stat --exit-code
